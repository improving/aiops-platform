name: Frontend E2E

# The fast Playwright tier: a TEST_MODE backend (SQLite, seeded catalogs, no
# cluster) plus a production build of the frontend. See docs/testing.md.

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-e2e.yml"
  workflow_dispatch:

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never re-resolve or rewrite uv.lock inside CI.
  UV_LOCKED: "1"

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # --- backend (TEST_MODE) ------------------------------------------------
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # pyhelm3 looks for the helm binary when the controllers are imported.
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      # --- frontend -----------------------------------------------------------
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # --- run ----------------------------------------------------------------
      - name: Run the fast tier
        working-directory: frontend
        env:
          E2E_START_SERVERS: "1"
          # The fast tier has no Keycloak; the backend accepts this only with TEST_MODE.
          AUTH_MODE: disabled
        run: pnpm e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
          if-no-files-found: ignore
