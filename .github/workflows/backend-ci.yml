name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never re-resolve or rewrite uv.lock inside CI.
  UV_LOCKED: "1"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # pyhelm3 runs "helm version" when a client is built; match the image.
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Sort imports
        run: ./hack/sort-imports.sh

      - name: Lint
        run: ./hack/lint.sh

      - name: Test
        env:
          AUTH_MODE: disabled
        run: ./hack/runtest.sh

      - name: Fail if lint or tests modified tracked files
        run: |
          git status --porcelain -- .
          test -z "$(git status --porcelain -- .)"
