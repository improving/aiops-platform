name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here.
        Use the private channel in SECURITY.md instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem.
      placeholder: |
        1. make kind-up gateway-up ...
        2. launch vLLM with ...
        3. the instance stays Pending
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Web UI
        - Helm chart / install
        - Model registry
        - Chat, embeddings, rerank
        - MCP servers and tools
        - Local development stack
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The chart version, the image tag or the commit.
      placeholder: chart 0.3.10, image tag 1f87e31

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Cluster and version, Kubernetes version, GPU and driver if it matters.
      placeholder: |
        kind v0.24 on colima, Kubernetes 1.32
        or: single k3s node, RTX 4090, driver 570
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant output. Redact tokens, hostnames and addresses.
        `kubectl -n <namespace> logs deploy/<release>-backend` and the pod's events help most.
      render: shell
