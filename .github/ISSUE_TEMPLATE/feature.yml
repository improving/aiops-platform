name: Feature request
description: Propose a capability or a change in behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where the platform gets in the way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The behaviour you want. A sketch of the API or the UI is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What you tried or considered, including workarounds.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Web UI
        - Helm chart / install
        - Model registry
        - Chat, embeddings, rerank
        - MCP servers and tools
        - Local development stack
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
