# Local Postgres for the backend control plane.
# Matches the backend's DATABASE_* defaults (see backend/db/database.py):
# user/password/db all "postgres", port 5432.
services:
  postgres:
    image: postgres:17-alpine
    container_name: aiops-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - aiops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  aiops-postgres-data:
