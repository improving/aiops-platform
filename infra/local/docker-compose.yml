# Local services for the control plane.
# postgres matches the backend's DATABASE_* defaults (see backend/db/database.py):
# user/password/db all "postgres", port 5432.
# Langflow used to run here under the "langflow" profile; it now runs in the
# kind cluster behind the gateway (infra/local/langflow/langflow.yaml,
# "make langflow-up") so it gets the same OIDC login as every other
# workload -- see docs/local-dev.md section "Langflow for the Develop page".
services:
  postgres:
    image: postgres:17-alpine
    container_name: aiops-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - aiops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  aiops-postgres-data:
