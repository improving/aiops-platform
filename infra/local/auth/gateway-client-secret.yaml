# Dev-only literal secret for the confidential "aiops-gateway" OIDC client
# (realm-aiops.json). Applied to ai-stack by "make auth-up"; T10 copies it
# into any other namespace that needs an OIDC SecurityPolicy.
apiVersion: v1
kind: Secret
metadata:
  name: aiops-gateway-oidc
  namespace: ai-stack
  labels:
    app.kubernetes.io/managed-by: aiops
type: Opaque
stringData:
  client-secret: dev-gateway-secret
