# Grafana behind the gateway; no SecurityPolicy (anonymous viewer, dev only).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: aiops
      namespace: envoy-gateway-system
  hostnames:
    - grafana.127.0.0.1.nip.io
  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80
