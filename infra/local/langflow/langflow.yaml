# Langflow behind the gateway (Task 11 of
# docs/superpowers/plans/2026-09-04-authentication.md). Replaces the
# docker-compose "langflow" profile: the Develop page now embeds
# https://langflow.127.0.0.1.nip.io instead of http://localhost:7860, so
# Langflow gets its own OIDC login instead of LANGFLOW_AUTO_LOGIN alone
# securing it. LANGFLOW_AUTO_LOGIN stays true for version 1 (design doc
# section 3.4): the gateway is Langflow's only ingress, so a second login
# screen inside Langflow itself would be redundant, not additional
# security. Applied by "make langflow-up" into the "ai-stack" namespace
# that "make kind-up"/"make gateway-up" already create.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: langflow
    app.kubernetes.io/managed-by: aiops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: langflow
    app.kubernetes.io/managed-by: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langflow
    spec:
      containers:
        - name: langflow
          image: langflowai/langflow:1.12.0
          env:
            # Local development only, version 1 (design doc section 3.4):
            # no login screen inside the frame the gateway already put an
            # OIDC login in front of. Turn off for version 2 in favour of
            # per-user Langflow API keys.
            - name: LANGFLOW_AUTO_LOGIN
              value: "true"
            - name: LANGFLOW_HOST
              value: "0.0.0.0"
            - name: LANGFLOW_PORT
              value: "7860"
          ports:
            - name: http
              containerPort: 7860
          readinessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/langflow
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langflow
---
apiVersion: v1
kind: Service
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: langflow
    app.kubernetes.io/managed-by: aiops
spec:
  selector:
    app.kubernetes.io/name: langflow
  ports:
    - name: http
      port: 7860
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/managed-by: aiops
spec:
  parentRefs:
    - name: aiops
      namespace: envoy-gateway-system
  hostnames:
    - "langflow.127.0.0.1.nip.io"
  rules:
    - backendRefs:
        - name: langflow
          port: 7860
---
# Langflow's OWN SecurityPolicy, not a target added to the shared
# aiops-workloads-oidc policy: this route has a host of its own
# (langflow.127.0.0.1.nip.io), so it can also have a redirect URI and a
# cookie suffix of its own -- the constraint that forced one shared
# policy onto notebook/vector-database routes (gateway notes, "Spike
# results": "Redirect URI: per-instance policies with a shared callback
# host: NO-GO; one shared policy: GO") was specifically about routes that
# share ONE callback host; a policy whose own route IS the callback host
# does not hit it. https://langflow.127.0.0.1.nip.io/oauth2/callback is
# registered as its own entry on the aiops-gateway client
# (infra/local/auth/realm-aiops.json), alongside the sso callback.
# No extAuth: design doc section 3.4 says Langflow is "Gateway OIDC, any
# member" -- unlike notebooks and vector databases there is no per-owner
# ownership check to make against the control plane.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: langflow-oidc
  namespace: ai-stack
  labels:
    app.kubernetes.io/managed-by: aiops
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: langflow
  oidc:
    provider:
      issuer: https://auth.127.0.0.1.nip.io/realms/aiops
      authorizationEndpoint: https://auth.127.0.0.1.nip.io/realms/aiops/protocol/openid-connect/auth
      tokenEndpoint: https://auth.127.0.0.1.nip.io/realms/aiops/protocol/openid-connect/token
      backendRefs:
        - name: keycloak
          namespace: auth
          port: 8080
    clientID: aiops-gateway
    clientSecret:
      name: aiops-gateway-oidc
    redirectURL: https://langflow.127.0.0.1.nip.io/oauth2/callback
    logoutPath: /oauth2/logout
    cookieDomain: 127.0.0.1.nip.io
    forwardAccessToken: true
    refreshToken: true
    scopes:
      - openid
      - profile
      - email
