# Langflow behind the gateway (Task 11 of
# docs/superpowers/plans/2026-09-04-authentication.md). Replaces the
# docker-compose "langflow" profile: the Develop page now embeds
# https://langflow.127.0.0.1.nip.io instead of http://localhost:7860, so
# Langflow gets its own OIDC login instead of LANGFLOW_AUTO_LOGIN alone
# securing it. LANGFLOW_AUTO_LOGIN stays true for version 1 (design doc
# section 3.4): the gateway is Langflow's only ingress, so a second login
# screen inside Langflow itself would be redundant, not additional
# security. Applied by "make langflow-up" into the "ai-stack" namespace
# that "make kind-up"/"make gateway-up" already create.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: langflow
    app.kubernetes.io/managed-by: aiops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: langflow
    app.kubernetes.io/managed-by: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langflow
    spec:
      containers:
        - name: langflow
          image: langflowai/langflow:1.12.0
          env:
            # Local development only, version 1 (design doc section 3.4):
            # no login screen inside the frame the gateway already put an
            # OIDC login in front of. Turn off for version 2 in favour of
            # per-user Langflow API keys.
            # Langflow writes its database next to the installed package
            # (/app/.venv/.../langflow/langflow.db), not into the mounted
            # volume, so before these two every pod restart lost every flow
            # -- and, because a restart also changes the auto-login user,
            # left already-open browsers holding a token for a user that no
            # longer exists. Point the config dir at the volume and keep the
            # database in it.
            - name: LANGFLOW_CONFIG_DIR
              value: /app/langflow
            - name: LANGFLOW_SAVE_DB_IN_CONFIG_DIR
              value: "true"
            # The Develop page embeds Langflow from its own gateway host,
            # so its cookies are third-party there. Default SameSite=Lax
            # cookies are not sent in that context, which left the frame
            # stuck on "Loading..." while the same URL worked in a tab.
            # None requires Secure, which the gateway's TLS provides.
            - name: LANGFLOW_ACCESS_SAME_SITE
              value: none
            - name: LANGFLOW_ACCESS_SECURE
              value: "true"
            - name: LANGFLOW_REFRESH_SAME_SITE
              value: none
            - name: LANGFLOW_REFRESH_SECURE
              value: "true"
            - name: LANGFLOW_AUTO_LOGIN
              value: "true"
            - name: LANGFLOW_HOST
              value: "0.0.0.0"
            - name: LANGFLOW_PORT
              value: "7860"
          ports:
            - name: http
              containerPort: 7860
          readinessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/langflow
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langflow
---
apiVersion: v1
kind: Service
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: langflow
    app.kubernetes.io/managed-by: aiops
spec:
  selector:
    app.kubernetes.io/name: langflow
  ports:
    - name: http
      port: 7860
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/managed-by: aiops
spec:
  parentRefs:
    - name: aiops
      namespace: envoy-gateway-system
  hostnames:
    - "langflow.127.0.0.1.nip.io"
  rules:
    - backendRefs:
        - name: langflow
          port: 7860
---
# Langflow's OWN SecurityPolicy, not a target added to the shared
# aiops-workloads-oidc policy: this route has a host of its own
# (langflow.127.0.0.1.nip.io), so it can also have a redirect URI and a
# cookie suffix of its own -- the constraint that forced one shared
# policy onto notebook/vector-database routes (gateway notes, "Spike
# results": "Redirect URI: per-instance policies with a shared callback
# host: NO-GO; one shared policy: GO") was specifically about routes that
# share ONE callback host; a policy whose own route IS the callback host
# does not hit it. https://langflow.127.0.0.1.nip.io/oauth2/callback is
# registered as its own entry on the aiops-gateway client
# (infra/local/auth/realm-aiops.json), alongside the sso callback.
# No extAuth, and no forwarded access token. Both were tried (#30) and both
# break Langflow, for the same reason:
#   - forwardAccessToken puts the *platform's* Keycloak token in
#     Authorization on every upstream request. Langflow reads that header
#     as its own JWT and answers 401 "Invalid token" to every API call
#     (measured: no header 403, foreign token 401, its own token 200), so
#     the page loads and nothing in it works. The browser cannot recover,
#     because the /api/v1/auto_login call that would mint a good token
#     carries the same bad header.
#   - ext-authz needs that header: it is how the platform token reaches
#     /v1alpha1/authz/route (headersToExtAuth). Turning the forward off to
#     save Langflow makes every ext-authz call 401 instead.
# So the check cannot be added until something replaces the Authorization
# header with a token Langflow accepts, which is the session bridge in
# docs/superpowers/plans/2026-09-07-langflow-per-user-identity.md (#29).
# Until then Langflow is protected by gateway OIDC alone: any realm user,
# no per-member rule and no log. That is the state #30 set out to fix and
# could not, so #30 is reopened rather than left half-applied.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: langflow-oidc
  namespace: ai-stack
  labels:
    app.kubernetes.io/managed-by: aiops
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: langflow
  oidc:
    provider:
      issuer: https://auth.127.0.0.1.nip.io/realms/aiops
      authorizationEndpoint: https://auth.127.0.0.1.nip.io/realms/aiops/protocol/openid-connect/auth
      tokenEndpoint: https://auth.127.0.0.1.nip.io/realms/aiops/protocol/openid-connect/token
      backendRefs:
        - name: keycloak
          namespace: auth
          port: 8080
    clientID: aiops-gateway
    clientSecret:
      name: aiops-gateway-oidc
    redirectURL: https://langflow.127.0.0.1.nip.io/oauth2/callback
    logoutPath: /oauth2/logout
    cookieDomain: 127.0.0.1.nip.io
    # Same reason as the Langflow cookies above: the gateway's own OIDC
    # cookies are third-party inside the Develop iframe, and without this
    # the flow reached /oauth2/callback and answered "OAuth flow failed".
    cookieConfig:
      sameSite: None
    forwardAccessToken: false
    refreshToken: true
    scopes:
      - openid
      - profile
      - email
