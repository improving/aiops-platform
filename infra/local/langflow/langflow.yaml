# Langflow on platform identity (ADR 0002, design
# docs/superpowers/specs/2026-09-08-langflow-native-identity-design.md).
# The gateway logs the browser in against Keycloak, asks the control
# plane whether this user may open Langflow (ext-authz), and forwards
# the access token; Langflow verifies that token itself
# (LANGFLOW_EXTERNAL_AUTH_*) and provisions a Langflow user per platform
# user. No auto-login, no second login screen, no shared workspace.
# Applied by "make langflow-up" into the "ai-stack" namespace.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: langflow
    app.kubernetes.io/managed-by: aiops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: langflow
    app.kubernetes.io/managed-by: aiops
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: one replica on a
  # ReadWriteOnce volume, so a second pod cannot usefully start anyway,
  # and on a single-node kind cluster the overlap is enough to push the
  # node into memory pressure (seen: both pods unready, the API server
  # briefly unreachable, chromadb restarted).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: langflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langflow
    spec:
      # Langflow insists on https for the JWKS it verifies tokens against
      # (http is allowed for localhost only), and the in-cluster Keycloak
      # Service is plain http. So the pod reaches Keycloak the way a
      # browser does: the public host, aliased to the gateway's ClusterIP
      # ("make langflow-up" substitutes __GATEWAY_IP__), whose certificate
      # the local CA signed. The init container builds a bundle of the
      # image's roots plus that CA, the way the chart's backend does,
      # because SSL_CERT_FILE replaces the roots rather than adding to
      # them and Langflow still has to reach public APIs. The image has
      # no system bundle under /etc/ssl; certifi's is the one it uses.
      hostAliases:
        - ip: __GATEWAY_IP__
          hostnames:
            - auth.127.0.0.1.nip.io
      initContainers:
        - name: ca-bundle
          image: langflowai/langflow:1.12.0
          command:
            - sh
            - -c
            - cat "$(python -c 'import certifi; print(certifi.where())')" /etc/aiops/ca/ca.crt > /etc/aiops/bundle/ca.crt
          volumeMounts:
            - name: ca
              mountPath: /etc/aiops/ca
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/aiops/bundle
      containers:
        - name: langflow
          image: langflowai/langflow:1.12.0
          env:
            - name: SSL_CERT_FILE
              value: /etc/aiops/bundle/ca.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/aiops/bundle/ca.crt
            # Langflow writes its database next to the installed package
            # unless told otherwise, and a restart then lost every flow.
            # Keep the database and the signing key on the volume.
            - name: LANGFLOW_CONFIG_DIR
              value: /app/langflow
            - name: LANGFLOW_SAVE_DB_IN_CONFIG_DIR
              value: "true"
            # Identity comes from the platform token the gateway forwards
            # (forwardAccessToken below). Langflow verifies it against the
            # realm's keys, fetched from the public issuer host through the
            # gateway (see hostAliases above), and creates a user per
            # `sub`, named after `preferred_username`.
            - name: LANGFLOW_AUTO_LOGIN
              value: "false"
            - name: LANGFLOW_EXTERNAL_AUTH_ENABLED
              value: "true"
            - name: LANGFLOW_EXTERNAL_AUTH_PROVIDER
              value: aiops
            - name: LANGFLOW_EXTERNAL_AUTH_JWKS_URL
              value: https://auth.127.0.0.1.nip.io/realms/aiops/protocol/openid-connect/certs
            - name: LANGFLOW_EXTERNAL_AUTH_ISSUER
              value: https://auth.127.0.0.1.nip.io/realms/aiops
            - name: LANGFLOW_EXTERNAL_AUTH_AUDIENCE
              value: aiops-api
            # Nobody signs up and nobody is created inactive: users come
            # from the token above, and only from there.
            - name: LANGFLOW_ENABLE_SIGNUP
              value: "false"
            - name: LANGFLOW_NEW_USER_IS_ACTIVE
              value: "false"
            # The break-glass superuser, for recovering another user's
            # flows or resetting a password through the API. Generated
            # once by "make langflow-up", never a person's login. Not
            # named "langflow": that user exists from the auto-login days
            # with a password nobody knows, and is deactivated by
            # infra/local/langflow/retire-shared-user.py.
            - name: LANGFLOW_SUPERUSER
              valueFrom:
                secretKeyRef:
                  name: langflow-superuser
                  key: username
            - name: LANGFLOW_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langflow-superuser
                  key: password
            # Langflow sets cookies of its own only for a password login
            # (the break-glass account). Cross-site inside the Develop
            # iframe, so SameSite=None, which needs Secure.
            - name: LANGFLOW_ACCESS_SAME_SITE
              value: none
            - name: LANGFLOW_ACCESS_SECURE
              value: "true"
            - name: LANGFLOW_REFRESH_SAME_SITE
              value: none
            - name: LANGFLOW_REFRESH_SECURE
              value: "true"
            # Langflow refuses requests to private addresses (SSRF
            # protection, on by default). Flows reach models through
            # LiteLLM only (never a deployed model's Service directly),
            # so only the LiteLLM Service is allowed; a hostname works.
            - name: LANGFLOW_SSRF_ALLOWED_HOSTS
              value: litellm.litellm.svc
            - name: LANGFLOW_HOST
              value: "0.0.0.0"
            - name: LANGFLOW_PORT
              value: "7860"
          ports:
            - name: http
              containerPort: 7860
          readinessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/langflow
            - name: ca-bundle
              mountPath: /etc/aiops/bundle
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langflow
        # infra/local/ca/ca.crt, published by "make langflow-up".
        - name: ca
          configMap:
            name: aiops-ca
        - name: ca-bundle
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: langflow
    app.kubernetes.io/managed-by: aiops
spec:
  selector:
    app.kubernetes.io/name: langflow
  ports:
    - name: http
      port: 7860
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langflow
  namespace: ai-stack
  labels:
    app.kubernetes.io/managed-by: aiops
spec:
  parentRefs:
    - name: aiops
      namespace: envoy-gateway-system
  hostnames:
    - "langflow.127.0.0.1.nip.io"
  rules:
    - backendRefs:
        - name: langflow
          port: 7860
---
# Langflow's OWN SecurityPolicy, not a target on the shared
# aiops-workloads-oidc policy: this route has a host of its own, so it
# can carry a redirect URI of its own (registered on the aiops-gateway
# client in infra/local/auth/realm-aiops.json next to the sso callback);
# the constraint that forced one shared policy onto the instance routes
# was routes sharing ONE callback host.
#
# forwardAccessToken is what makes identity work: Langflow reads the
# forwarded platform token (LANGFLOW_EXTERNAL_AUTH_* above). It is also
# what the ext-authz call needs, since the token is how the control
# plane knows who is asking. passThroughAuthHeader lets a request that
# already carries a bearer skip the OIDC redirect, so a caller with a
# platform token -- the backend provisioning a user's Langflow account,
# a script -- reaches Langflow's API through this same host, and both
# ext-authz and Langflow still verify the token. Envoy Gateway insists
# that pass-through comes with a JWT provider, so Envoy verifies such a
# bearer too (jwt below). One trap, measured: a SecurityPolicy the
# controller rejects (status Accepted=False) is not applied at all, and
# the route it targets is then OPEN -- no login, no ext-authz. Check
# the status after every change to this object.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: langflow-oidc
  namespace: ai-stack
  labels:
    app.kubernetes.io/managed-by: aiops
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: langflow
  oidc:
    provider:
      issuer: https://auth.127.0.0.1.nip.io/realms/aiops
      authorizationEndpoint: https://auth.127.0.0.1.nip.io/realms/aiops/protocol/openid-connect/auth
      tokenEndpoint: https://auth.127.0.0.1.nip.io/realms/aiops/protocol/openid-connect/token
      backendRefs:
        - name: keycloak
          namespace: auth
          port: 8080
    clientID: aiops-gateway
    clientSecret:
      name: aiops-gateway-oidc
    redirectURL: https://langflow.127.0.0.1.nip.io/oauth2/callback
    logoutPath: /oauth2/logout
    cookieDomain: 127.0.0.1.nip.io
    # The gateway's cookies are third-party inside the Develop iframe;
    # without this the flow reached /oauth2/callback and answered
    # "OAuth flow failed".
    cookieConfig:
      sameSite: None
    forwardAccessToken: true
    passThroughAuthHeader: true
    refreshToken: true
    scopes:
      - openid
      - profile
      - email
  # The JWT provider pass-through requires: a bearer that skips the login
  # is verified against the realm's keys (in-cluster, plain http is fine
  # for Envoy) before ext-authz and Langflow see it. optional, because a
  # browser's first request carries no bearer yet and must reach the
  # OIDC redirect; an invalid bearer is still refused.
  jwt:
    optional: true
    providers:
      - name: keycloak
        issuer: https://auth.127.0.0.1.nip.io/realms/aiops
        audiences:
          - aiops-api
        remoteJWKS:
          uri: http://keycloak.auth.svc:8080/realms/aiops/protocol/openid-connect/certs
          backendRefs:
            - name: keycloak
              namespace: auth
              port: 8080
  extAuth:
    headersToExtAuth:
      - authorization
      - cookie
    http:
      backendRefs:
        - name: aiops-backend
          port: 8000
      path: /v1alpha1/authz/route
      headersToBackend:
        - x-auth-user-email
        - x-auth-user-sub
        - x-auth-org
    failOpen: false
