# The gateway host the backend on the laptop uses to reach LiteLLM.
# LiteLLM authenticates every call with its own master or virtual key,
# so this route carries no SecurityPolicy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: litellm
spec:
  parentRefs:
    - name: aiops
      namespace: envoy-gateway-system
  hostnames:
    - litellm.127.0.0.1.nip.io
  rules:
    - backendRefs:
        - name: litellm
          port: 4000
