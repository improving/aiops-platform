task: llm-sft
base_model: meta-llama/Meta-Llama-3-70B-Instruct
project_name: autotrain-llama3-70b-math-v2
log: tensorboard
backend: local

data:
  path: rishiraj/guanaco-style-metamath-40k
  train_split: train
  valid_split: null
  chat_template: null
  column_mapping:
    text_column: text

params:
  block_size: 1024
  model_max_length: 8192
  epochs: 2
  batch_size: 1
  lr: 2e-5
  peft: true
  quantization: null
  target_modules: all-linear
  padding: left
  optimizer: paged_adamw_8bit
  scheduler: cosine
  gradient_accumulation: 16
  mixed_precision: bf16
