image:
  repository: nvcr.io/nim/nvidia/nv-embedqa-mistral-7b-v2
  tag: 1.0.1
  pullPolicy: IfNotPresent
persistence:
  existingClaimName: nim-pvc
  createPV: false

imagePullSecrets:
  nvcrimagepullsecret: true

imagePullSecret:
  # Leave blank, if no imagePullSecret is needed.
  registry: "nvcr.io"
  name: "registry-secret"
  # If set to false, the chart expects either a imagePullSecret
  # with the name configured above to be present on the cluster or that no
  # credentials are needed.
  create: false
  username: '$oauthtoken'
  password: ""

metrics:
  enabled: true

nemo:
  userID: "65534"
  groupID: "65534"

service:
  type: LoadBalancer
  http_port: 8080
  grpc_port: null
  nodePort: null
  annotations: {}

nodeSelector:
  kubernetes.io/hostname: gpu-node-2

resources:
  limits:
    ephemeral-storage: 28Gi
    nvidia.com/gpu: 1
    memory: 32Gi
    cpu: "16000m"
  requests:
    ephemeral-storage: 28Gi
    nvidia.com/gpu: 1
    memory: 16Gi
    cpu: "4000m"