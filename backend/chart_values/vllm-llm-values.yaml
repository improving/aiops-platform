nodeSelector:
  kubernetes.io/hostname: gpu-node-3

config:
  model: "meta-llama/Meta-Llama-3.1-8B-Instruct"

env:
  - name: HF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: hf-api-token
        key: HF_API_TOKEN
  - name: HF_HUB_OFFLINE
    value: "1"
  - name: HF_HUB_CACHE
    value: "/model"

resources:
  limits:
    nvidia.com/gpu: 1
  requests:
    nvidia.com/gpu: 1

strategy:
  type: Recreate

service:
  type: LoadBalancer
  port: 8000

serviceMonitor:
  enabled: true
  additionalLabels:
    release: prometheus

volumeMounts:
  - name: hf-cache
    mountPath: /model

volumes:
  - name: hf-cache
    persistentVolumeClaim:
      claimName: hf-cache
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: "1Gi"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 4
