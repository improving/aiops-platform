enabled: true

nodeSelector:
  kubernetes.io/hostname: gpu-node-1

config:
  modelID: "BAAI/bge-reranker-large"

env:
  - name: MAX_CLIENT_BATCH_SIZE
    value: "1024"
  - name: RUST_BACKTRACE
    value: "full"
  - name: HF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: hf-api-token
        key: HF_API_TOKEN

resources:
  limits:
    nvidia.com/gpu: 1
  requests:
    nvidia.com/gpu: 1

strategy:
  type: Recreate

service:
  type: LoadBalancer
  port: 80

serviceMonitor:
  enabled: true
  additionalLabels:
    release: prometheus

volumeMounts:
  - name: hf-cache
    mountPath: /data

volumes:
  - name: hf-cache
    persistentVolumeClaim:
      claimName: hf-cache