[project]
name = "aiops-backend"
version = "0.1.0"
description = "FastAPI control plane that deploys AI services on Kubernetes via Helm"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1,<0.166",
    "uvicorn[standard]>=0.52.4,<0.55",
    "pydantic>=2.13.5,<3",
    "sqlalchemy>=2.0.52,<2.2",
    "kubernetes>=36.0.3,<38",
    "apscheduler>=3.11.3,<4",
    "pyhelm3>=0.5.5,<0.6",
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.3,<7",
    "requests>=2.34.2,<3",
    "psycopg2-binary>=2.9.12,<3",
    "alembic>=1.19,<2",
    "pyjwt[crypto]>=2.13,<3",
    "httpx>=0.28.1,<0.29",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-snapshot>=0.9.0,<1",
    "ruff>=0.16.6,<0.18",
]

[tool.uv]
# The backend is a flat application directory, not an installable package.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["."]
norecursedirs = [".*", "tmp", "snapshots", "templates", "raw_data", "manifests"]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # Third-party warnings we cannot fix here.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
# .style.yapf was "based_on_style = pep8", whose column limit is 79.
line-length = 79
target-version = "py313"
extend-exclude = ["tmp", "snapshots", "templates", "raw_data", "manifests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # FastAPI dependency injection uses Depends() in argument defaults.
    "B008",
    # Existing handlers re-raise HTTPException without chaining.
    "B904",
    # The formatter owns line length; the remainder are long strings.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules re-export names.
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
# The local alembic/ directory (env.py, versions/) is not the package.
known-third-party = ["alembic"]
known-first-party = [
    "api",
    "controller",
    "core",
    "db",
    "logger",
    "models",
    "paths",
    "repositories",
    "schemas",
    "testing",
    "utils",
]
