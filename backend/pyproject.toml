[project]
name = "aiops-backend"
version = "0.1.0"
description = "FastAPI control plane that deploys AI services on Kubernetes via Helm"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.52.4,<0.53",
    "pydantic>=2.13.5,<3",
    "sqlalchemy>=2.0.52,<2.1",
    "kubernetes>=36.0.3,<37",
    "apscheduler>=3.11.3,<4",
    "pyhelm3>=0.5.5,<0.6",
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.3,<7",
    "requests>=2.34.2,<3",
    "psycopg2-binary>=2.9.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "httpx>=0.28.1,<0.29",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-snapshot>=0.9.0,<1",
    "ruff>=0.16.6,<0.17",
]

[tool.uv]
# The backend is a flat application directory, not an installable package.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["."]
norecursedirs = ["tmp", ".venv", "snapshots", "templates", "raw_data", "manifests"]
