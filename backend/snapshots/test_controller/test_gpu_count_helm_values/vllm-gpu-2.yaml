args:
- --tensor-parallel-size
- '2'
config:
  model: org/model
env:
- name: HF_TOKEN
  valueFrom:
    secretKeyRef:
      key: HF_API_TOKEN
      name: hf-api-token
      optional: true
- name: HF_API_TOKEN
  valueFrom:
    secretKeyRef:
      key: HF_API_TOKEN
      name: hf-api-token
      optional: true
- name: VLLM_API_KEY
  valueFrom:
    secretKeyRef:
      key: api-key
      name: inf-000000af-credentials
- name: VLLM_CACHE_ROOT
  value: /model/.vllm-cache
livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 1800
  periodSeconds: 30
  successThreshold: 1
  timeoutSeconds: 2
readinessProbe:
  failureThreshold: 4
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  successThreshold: 1
  timeoutSeconds: 2
replicaCount: 2
resources:
  limits:
    cpu: '8'
    memory: 32Gi
    nvidia.com/gpu: 2
  requests:
    cpu: '8'
    memory: 32Gi
    nvidia.com/gpu: 2
service:
  port: 80
  type: ClusterIP
serviceMonitor:
  additionalLabels:
    release: prometheus
  enabled: true
strategy:
  type: Recreate
volumeMounts:
- mountPath: /model
  name: hf-cache
volumes:
- name: hf-cache
  persistentVolumeClaim:
    claimName: hf-cache
- emptyDir:
    medium: Memory
    sizeLimit: 1Gi
  name: shm
