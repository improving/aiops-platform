args: null
config:
  max_model_len: 4192
  model: meta-llama/Meta-Llama-3.1-8B-Instruct
  port: 8000
env:
- name: HF_API_TOKEN
  valueFrom:
    secretKeyRef:
      key: HF_API_TOKEN
      name: hf-api-token
- name: HF_HUB_OFFLINE
  value: '1'
- name: HF_HUB_CACHE
  value: /model
livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  successThreshold: 1
  timeoutSeconds: 2
nodeSelector:
  kubernetes.io/hostname: gpu-node-3
readinessProbe:
  failureThreshold: 4
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  successThreshold: 1
  timeoutSeconds: 2
resources:
  limits:
    nvidia.com/gpu: 1
  requests:
    nvidia.com/gpu: 1
service:
  port: 80
  type: LoadBalancer
serviceMonitor:
  additionalLabels:
    release: prometheus
  enabled: true
strategy:
  type: Recreate
volumeMounts:
- mountPath: /model
  name: hf-cache
volumes:
- name: hf-cache
  persistentVolumeClaim:
    claimName: hf-cache
- emptyDir:
    medium: Memory
    sizeLimit: 1Gi
  name: shm
