notebooks:
  jupyter:
    enabled: false
    image:
      pullPolicy: IfNotPresent
      repository: kubeflownotebookswg/codeserver
      tag: null
    name: notebook-vscode
    resources:
      limits:
        cpu: '1'
        memory: 4Gi
      requests:
        cpu: '1'
        memory: 4Gi
    storage:
      size: 5Gi
  vscode:
    enabled: true
    image:
      pullPolicy: IfNotPresent
      repository: kubeflownotebookswg/codeserver
      tag: null
    name: notebook-vscode
    resources:
      limits:
        cpu: '1'
        memory: 4Gi
      requests:
        cpu: '1'
        memory: 4Gi
    storage:
      size: 5Gi
service:
  enabled: true
  port: 80
  type: LoadBalancer
