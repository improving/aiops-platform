notebooks:
  jupyter:
    enabled: true
    image:
      pullPolicy: IfNotPresent
      repository: kubeflownotebookswg/jupyter-pytorch-full
      tag: null
    name: notebook-jupyter
    resources:
      limits:
        cpu: '0.5'
        memory: 1Gi
        nvidia.com/gpu: null
      requests:
        cpu: '0.5'
        memory: 1Gi
    storage:
      size: 5Gi
  vscode:
    enabled: false
    image:
      pullPolicy: IfNotPresent
      repository: kubeflownotebookswg/jupyter-pytorch-full
      tag: null
    name: notebook-jupyter
    resources:
      limits:
        cpu: '0.5'
        memory: 1Gi
      requests:
        cpu: '0.5'
        memory: 1Gi
    storage:
      size: 5Gi
service:
  enabled: true
  port: 80
  type: ClusterIP
